name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security considerations
      description: Could this feature expose sensitive data, add network access or weaken fail-closed behaviour?
